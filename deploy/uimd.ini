; CommandBarExt Phase 0 -- loose uimd.ini for the game directory.
; Replaces the 517-byte override that ships inside cncnet.mix (content kept
; verbatim below, plus our new button). A loose file should win over the mix
; copy; the FindIndex('Hunt') log line is the proof that it did.

[VersionInfo]
Name=Yuri's Revenge (CnCnet)
Version=1.001

[AdvancedCommandBar]
ButtonList=Team01,Team02,TypeSelect,Deploy,Guard,PlanningMode,Hunt,AggressiveStance,EffectProbe,NoGoZone

[MultiplayerAdvancedCommandBar]
ButtonList=Team01,Team02,TypeSelect,Deploy,Guard,PlanningMode,Beacon,Hunt,AggressiveStance,EffectProbe,NoGoZone

[Sidebar]
CenterPauseMenuBackground=yes
HarvesterCounter.Show=yes
HarvesterCounter.ConditionYellow=99%
HarvesterCounter.ConditionRed=50%
PowerDelta.Show=yes
PowerDelta.ConditionYellow=75%
PowerDelta.ConditionRed=100%

[ToolTips]
ExtendedToolTips=yes

; EOF guard -- the YR INI parser drops the final line of every file.
